services:
  backend:
    container_name: tangent-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      ENV: prod
      COOKIE_SECURE: "true"
      CORS_ORIGINS: "https://riskybusinesses.uk,https://www.riskybusinesses.uk"
      BACKEND_URL: "https://riskybusinesses.uk"
      FRONTEND_URL: "https://riskybusinesses.uk"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Frontend disabled in prod — Caddy now serves the static Vite build
  # (baked into the caddy image via Dockerfile.caddy).
  # `profiles: [never]` keeps the service definition for dev but prevents
  # it from being started unless --profile never is explicitly passed.
  frontend:
    profiles: [never]

  postgres:
    container_name: tangent-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: tangent-caddy:latest
    container_name: tangent-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # Bind localhost ONLY — cloudflared y accède en local
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
