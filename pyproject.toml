[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Portfolio analytics dashboard — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "yfinance>=0.2.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "scipy>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]