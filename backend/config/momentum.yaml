# « La liste de l'année » — une règle publiée, pas une opinion.
#
# Acheter les titres qui ont le plus monté sur les douze derniers mois en
# ignorant le dernier (Jegadeesh & Titman 1993 ; Rouwenhorst 1998 pour
# l'Europe), vendre ceux qui sortent de la liste, refaire à date fixe.
# Le score divise le rendement par la volatilité (Barroso & Santa-Clara 2015),
# ce qui écarte les fusées qui explosent et adoucit les krachs de momentum.
#
# Rien ici n'est une donnée : l'univers vient des positions du jour d'un ETF
# indiciel (data_sources.yaml → xtrackers), gardées en euros, et les cours de
# Yahoo. Ce fichier ne porte que la règle.

# Le Stoxx Europe 600 en euros : grandes et moyennes capitalisations de la
# zone euro, ~300 titres, places de l'UE — pour l'essentiel éligibles au PEA
# (Shell ou Prosus y sont cotés en euros sans l'être).
universe: [stoxx_europe_600]

lookback_months: 12   # la fenêtre de mesure
skip_months: 1        # le dernier mois est ignoré : il renverse à court terme
top: 30               # titres retenus, à poids égal
min_history_months: 12
review: quarterly     # monthly | quarterly | annual — quand la liste est refaite

# Ce qu'un aller-retour coûte, en fraction du montant : courtage et écart de
# cours. Une revue plus fréquente gagne en réactivité et perd ici.
cost_per_trade: 0.002

# Le frein : après une année de marché en baisse, le momentum se retourne
# violemment au rebond (Daniel & Moskowitz 2016). Quand le rendement à douze
# mois de l'univers à poids égal est négatif, la liste est vide et la poche
# reste en cash jusqu'à la revue suivante.
guard:
  market_lookback_months: 12
