# Frais annuels par broker — appliqués mensuellement dans la projection DCA.
# Toutes les valeurs sont des fractions décimales (0.005 = 0,5 %) sauf
# `fixed_per_line_eur` qui est en euros par ligne en compte par an.
#
# Modèle de frais (par mois) :
#   fee_t = fixed_per_line_eur × n_lines / 12
#         + (custody_pct + rebates_pct) × portfolio_value_t / 12
#         + courtage_pct × monthly_contribution
#
# Si tu changes de banque, édite simplement `default_broker` ou passe
# `?broker=fortuneo` à l'endpoint /projection.

default_broker: bnp_start

# Institution name (as returned by Powens) → broker_id
# Used to autodetect a user's broker at first sync. Match is case-insensitive,
# checks 'contains' (e.g. "BNP Paribas SA" matches "BNP Paribas").
institution_to_broker:
  "BNP Paribas": bnp_start
  "Fortuneo": fortuneo
  "Bourse Direct": bourse_direct
  "Trade Republic": trade_republic
  "Boursorama": boursorama
  "Boursobank": boursorama

brokers:
  bnp_start:
    name: "BNP Paribas — Offre Bourse Start"
    fixed_per_line_eur: 5.0       # 5 €/an par ligne en compte
    custody_pct: 0.0040           # 0,40 % proportionnel sur portefeuille moyen
    rebates_pct: 0.0019           # 0,19 % rétrocessions OPC encaissées par la banque
    courtage_pct: 0.0050          # 0,50 % par ordre (plafond légal PEA)

  fortuneo:
    name: "Fortuneo Bourse"
    fixed_per_line_eur: 0.0
    custody_pct: 0.0
    rebates_pct: 0.0
    courtage_pct: 0.0020          # ≈ 0,20 % effectif (1,95 € sur ordres < 500 €)

  bourse_direct:
    name: "Bourse Direct"
    fixed_per_line_eur: 0.0
    custody_pct: 0.0
    rebates_pct: 0.0
    courtage_pct: 0.0050          # 0,99 € forfait ≈ 0,50 % sur ordre 200 €

  trade_republic:
    name: "Trade Republic"
    fixed_per_line_eur: 0.0
    custody_pct: 0.0
    rebates_pct: 0.0
    courtage_pct: 0.0000          # plans programmés gratuits

  none:
    name: "Aucun frais (idéal)"
    fixed_per_line_eur: 0.0
    custody_pct: 0.0
    rebates_pct: 0.0
    courtage_pct: 0.0
