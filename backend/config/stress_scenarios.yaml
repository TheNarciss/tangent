# Rejeu historique : ce que tes placements auraient fait pendant les crises passées.
#
# Pourquoi des classes d'actifs et pas les cours de tes lignes : aucun ETF
# français n'a d'historique avant 2009, donc rejouer 2000 ou 2008 sur les prix
# réels est impossible — c'est ce qui limitait Tangent à trois fenêtres
# post-2020. On mappe chaque ligne vers une classe et on rejoue la classe,
# comme le fait un gérant (« rejeu historique », vocabulaire EBA 2018).
#
# Tous les rendements sont pic-à-creux, **du point de vue d'un investisseur en
# euros** : le change est déjà dedans. `equity_world_usd` est le même épisode
# vu d'un investisseur en dollars ; l'écart entre les deux est ce que la devise
# a coûté ou rapporté.
#
# Deux classes ont leurs chiffres CALCULÉS et non recopiés de l'étude :
#
#   `gold`           — fixings LBMA (ADR-024), composés sur la fenêtre.
#   `equity_us_tech` — indice NASDAQ 100 quotidien, servi par FRED depuis 1986.
#
# Les deux sont mesurés d'un bout à l'autre de la fenêtre, et convertis en euros
# au cours BCE de ces deux jours-là. Pas au pire moment de chaque classe : elles
# ne touchent pas le fond le même jour — l'or a eu son pire moment en octobre
# 2008, les actions en mars 2009 — et additionner les pires moments décrirait
# une journée qui n'a jamais existé.
#
# Les deux sont en euros à partir de 1999 et en dollars avant : la monnaie
# n'existait pas.
#
# Pourquoi le Nasdaq et pas l'Europe ni le Japon : FRED ne sert ces régions
# qu'en mensuel (séries OECD), et une fenêtre en fin de mois ne se compare pas
# à un pic-à-creux. Un indice quotidien, ou rien.
#
# Source : docs/ETUDE_METHODE_FINANCIERE_2026-09.md §7.6 (MSCI World EUR et USD,
# Bloomberg Euro Aggregate, Fama-French développés raccordés en euro synthétique
# avant 1999). Dernière revue : 2026-09.
#
# Non rejoués faute de chiffre ferme : 1973-74 (stagflation, ~−45 à −50 % en DEM)
# et 1987 (~−28 à −30 %). L'étude ne donne qu'une fourchette ; on préfère une
# fenêtre en moins à un chiffre inventé.

# La classe d'une ligne vient de ce qu'elle est (finance/classification.py,
# ADR-025), plus d'une table de six tickers qui ne connaissait que ceux du
# premier utilisateur. Ici on dit seulement comment une classe reconnue se
# rejoue dans les scénarios ci-dessous.
#
# Chaque région se rejoue sur son propre indice quand une série le permet, et
# emprunte l'amplitude du monde sinon (voir `fallback_class`). Un fonds
# sectoriel n'a pas d'indice à lui et reste rejoué en actions monde, ce qui
# sous-estime son amplitude — c'est écrit sous le tableau dans l'app.
class_map:
  equity_world: equity_world
  equity_us: equity_us
  equity_us_tech: equity_us_tech
  equity_europe: equity_europe
  equity_japan: equity_japan
  equity_emerging: equity_emerging
  equity_sector: equity_world     # un pari sectoriel bouge plus que le monde : sous-estimé ici
  bonds: bonds_euro
  money_market: cash
  gold: gold
  silver: gold

# Une ligne non reconnue est rejouée en actions monde : c'est l'hypothèse la
# plus fréquente pour un titre logé dans un PEA, et la plus prudente. L'écran
# Placements affiche l'indice reconnu sous chaque ligne, donc l'utilisateur
# voit lesquelles ne le sont pas.
default_asset_class: equity_world

# Type d'enveloppe → classe. Les livrets ne bougent pas en crise (capital
# garanti) ; le fonds euros non plus en prix, seul son taux futur baisse.
envelope_classes:
  livret_a: cash
  livret_a_jeune: cash
  livret_b: cash
  ldds: cash
  lep: cash
  csl: cash
  cat: cash
  pel: cash
  cel: cash

# Compte d'investissement valorisé en bloc (pas de détail des lignes) → classe.
account_classes:
  life_insurance: fonds_euros
  capitalisation: fonds_euros
  per: fonds_euros
  perp: fonds_euros
  perco: fonds_euros
  madelin: fonds_euros
  article_83: fonds_euros
  pee: equity_world
  cto: equity_world
  pea: equity_world

# Séries d'indices par classe. La boucle regarde, pour chaque classe présente
# dans le portefeuille et pour chaque épisode, si une série quotidienne couvre
# la fenêtre. Si oui, le rendement est CALCULÉ pic-à-creux et converti en euros
# au cours BCE des deux jours retenus — exactement la méthode des chiffres de
# l'étude. Sinon on retombe sur la valeur déclarée dans `returns`, et l'app le
# dit.
#
# Ajouter une classe ici suffit : rien à coder, rien à recalculer à la main.
#
# Chaque classe liste des CANDIDATS, essayés dans l'ordre : le premier dont la
# série couvre la fenêtre gagne. Personne n'a à vérifier à la main jusqu'où
# remonte un indice — la boucle s'en charge, épisode par épisode. Un candidat
# qui ne répond pas, ou qui commence trop tard, est simplement sauté.
#
# `fred` sert des séries quotidiennes sans clé et sans bridage, mais seulement
# pour les indices américains ; `yahoo` couvre le reste du monde sans contrat de
# service, donc jamais seul quand une source stable existe.
class_series:
  equity_us_tech:
    - { provider: fred,  id: NASDAQ100, currency: USD }   # quotidien depuis 1986
    - { provider: yahoo, id: "^NDX",    currency: USD }
  equity_us:
    - { provider: yahoo, id: "^GSPC",   currency: USD }
  equity_europe:
    - { provider: yahoo, id: "^STOXX",  currency: EUR }   # STOXX Europe 600
  equity_japan:
    - { provider: yahoo, id: "^N225",   currency: JPY }
  equity_emerging:
    - { provider: yahoo, id: "EEM",     currency: USD }   # faute d'indice, l'ETF de référence
  gold:
    - { provider: lbma,  id: gold,      currency: EUR }   # fixing de l'après-midi

# De qui une classe emprunte son chiffre quand ni sa ligne ni son indice n'ont
# pu être mesurés sur cet épisode. Sans cette table, une classe rejouée sans
# `returns` compterait pour ZÉRO perte : la poche passerait pour immunisée en
# pleine crise, ce qui est le pire mensonge que puisse produire un stress test.
fallback_class:
  equity_us: equity_world
  equity_europe: equity_world
  equity_japan: equity_world
  equity_emerging: equity_world

scenarios:
  - id: gulf_1990
    label: "Guerre du Golfe et krach japonais (1990)"
    window: { from: "1990-07-01", to: "1990-09-30" }
    start: "juillet 1990"
    end: "septembre 1990"
    description: "Le Japon perd la moitié de sa valeur sur 1990-92"
    returns: { equity_world: -0.235, equity_world_usd: -0.203, bonds_euro: 0.0, fonds_euros: 0.0, cash: 0.0, gold: 0.143, equity_us_tech: -0.257 }   # or : en dollars : l'euro n'existait pas encore

  - id: ltcm_1998
    label: "Faillite de LTCM (1998)"
    window: { from: "1998-07-01", to: "1998-09-30" }
    start: "juillet 1998"
    end: "septembre 1998"
    description: "Chute rapide, remontée tout aussi rapide"
    returns: { equity_world: -0.181, equity_world_usd: -0.144, bonds_euro: 0.0, fonds_euros: 0.0, cash: 0.0, gold: -0.010, equity_us_tech: -0.008 }   # or : en dollars : l'euro n'existait pas encore

  - id: dotcom_2000
    label: "Éclatement de la bulle internet (2000-2003)"
    window: { from: "2000-08-01", to: "2003-03-31" }
    start: "août 2000"
    end: "mars 2003"
    description: "Trente et un mois de glissade, la pire baisse des quarante dernières années pour un Européen"
    returns: { equity_world: -0.525, equity_world_usd: -0.446, bonds_euro: 0.16, fonds_euros: 0.12, cash: 0.08, gold: 0.027, equity_us_tech: -0.751 }

  - id: gfc_2008
    label: "Crise financière (2007-2009)"
    window: { from: "2007-10-01", to: "2009-03-31" }
    start: "octobre 2007"
    end: "mars 2009"
    description: "Les obligations et le dollar ont amorti le choc"
    returns: { equity_world: -0.482, equity_world_usd: -0.536, bonds_euro: 0.06, fonds_euros: 0.06, cash: 0.05, gold: 0.321, equity_us_tech: -0.375 }

  - id: euro_2011
    label: "Crise de la dette en zone euro (2011)"
    window: { from: "2011-04-01", to: "2011-09-30" }
    start: "avril 2011"
    end: "septembre 2011"
    description: "Risque souverain domestique : l'Italie et l'Espagne perdent 10 à 15 %"
    returns: { equity_world: -0.153, equity_world_usd: -0.204, bonds_euro: 0.03, fonds_euros: 0.02, cash: 0.01, gold: 0.197, equity_us_tech: -0.044 }

  - id: china_2015
    label: "Chine et pétrole (2015-2016)"
    window: { from: "2015-04-01", to: "2016-02-29" }
    start: "avril 2015"
    end: "février 2016"
    description: "Deux corrections de 10 % en six mois"
    returns: { equity_world: -0.121, equity_world_usd: -0.125, bonds_euro: 0.0, fonds_euros: 0.01, cash: 0.0, gold: 0.019, equity_us_tech: -0.037 }

  - id: q4_2018
    label: "Quatrième trimestre 2018"
    window: { from: "2018-09-01", to: "2018-12-31" }
    start: "septembre 2018"
    end: "décembre 2018"
    description: "Resserrement monétaire et guerre commerciale"
    returns: { equity_world: -0.127, equity_world_usd: -0.141, bonds_euro: 0.004, fonds_euros: 0.005, cash: 0.0, gold: 0.080, equity_us_tech: -0.161 }

  - id: covid_2020
    label: "Krach du COVID (février-mars 2020)"
    window: { from: "2020-02-19", to: "2020-03-23" }
    start: "19 février 2020"
    end: "23 mars 2020"
    # Le chiffre USD publié est quotidien (−34 %), l'euro est en fin de mois :
    # les deux ne sont pas comparables, donc pas d'effet devise affiché ici.
    description: "La baisse de 30 % la plus rapide de l'histoire"
    returns: { equity_world: -0.204, bonds_euro: -0.05, fonds_euros: 0.0, cash: 0.0, gold: -0.051, equity_us_tech: -0.278 }

  - id: inflation_2022
    label: "Inflation et remontée des taux (2022)"
    window: { from: "2022-01-01", to: "2022-10-31" }
    start: "janvier 2022"
    end: "octobre 2022"
    description: "Les deux jambes du 60/40 tombent ensemble, le seul régime d'inflation de la série"
    returns: { equity_world: -0.142, equity_world_usd: -0.255, bonds_euro: -0.17, fonds_euros: 0.0, cash: 0.0, gold: 0.032, equity_us_tech: -0.208 }

  - id: tariffs_2025
    label: "Droits de douane (2025)"
    window: { from: "2025-02-01", to: "2025-04-30" }
    start: "février 2025"
    end: "avril 2025"
    description: "C'est la devise, pas les actions, qui a fait la perte en euros"
    returns: { equity_world: -0.118, equity_world_usd: -0.05, bonds_euro: 0.0, fonds_euros: 0.0, cash: 0.0, gold: 0.054, equity_us_tech: -0.170 }
