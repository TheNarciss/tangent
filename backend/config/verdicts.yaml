# Seuils des verdicts (ADR-023). Fractions annuelles.

# Inflation et taux sans risque ne sont plus ici : ce sont des valeurs
# observées, servies par app/finance/macro.py depuis la BCE et l'IPC (ADR-026).
# Dernière revue : 2026-09 — sources : étude méthode §1.3 et §8.2 (frais < 0,5 %/an
# pour un PEA + ETF indiciel ; AV bancaire en UC : 2 à 3 %/an).

fees:
  green_max: 0.005     # jusqu'à 0,5 %/an : rien à changer
  amber_max: 0.010     # jusqu'à 1 %/an : à surveiller ; au-delà, rouge
  reference: 0.003     # coût d'un PEA en ligne + ETF monde (TER ~0,20 % + courtage ~0,10 %)
  min_coverage: 0.5    # part de la valeur dont le TER est connu, en dessous : verdict « unknown »

next_euro:
  precaution_months: 3         # épargne de précaution visée : 3 mois de dépenses (étude §8.1 : 3 à 6 mois)
  precaution_min_months: 1     # en dessous d'un mois : rouge
  liquid_envelopes: [livret_a, livret_a_jeune, ldds, lep, livret_b, csl]
  pea_ceiling_eur: 150000      # plafond légal des versements sur un PEA
  pea_vs_cto_pct: 0.006        # écart de rendement net PEA vs CTO, borne basse (étude §1 : 60 à 90 pb/an)
  per_tmi_min: 0.30            # le PER déductible n'est intéressant qu'à partir de cette tranche (étude §8.1)
  per_ceiling_pct: 0.10        # plafond de déduction : 10 % des revenus…
  per_ceiling_min_eur: 4637    # …au moins 10 % du PASS N-1
  per_ceiling_max_eur: 37094   # …au plus 8 × 10 % du PASS N-1
  # Barème de l'impôt sur le revenu 2025 (revenus 2024), par part, service-public.fr.
  # À mettre à jour chaque année à la loi de finances.
  tax_brackets:
    - { up_to: 11497, rate: 0.00 }
    - { up_to: 29315, rate: 0.11 }
    - { up_to: 83823, rate: 0.30 }
    - { up_to: 180294, rate: 0.41 }
    - { up_to: null, rate: 0.45 }

risk_share:
  # Part d'actions de la poche long terme, sur la droite de marché de risk_levels.yaml :
  # part visée = volatilité max du cran / volatilité des actions monde, plafonnée à 100 %.
  # C'est la part de Merton w = (μ − r) / (γ σ²) avec γ implicite par cran (étude §5.2, §8.1).
  equity_premium: 0.045      # actions monde 7 % − sans risque 2,5 % (cma.yaml, analytics.RISK_FREE)
  equity_sigma: 0.15         # volatilité annuelle des actions monde (risk_levels.yaml)
  band: 0.10                 # ±10 points autour de la cible : rien à faire
  red_gap: 0.30              # au-delà de 30 points d'écart : rouge
  # Plafond par horizon (capacité de perte) : argent dont on a besoin dans N ans.
  horizon_caps:
    - { max_years: 3, max_share: 0.10 }
    - { max_years: 5, max_share: 0.30 }
    - { max_years: 8, max_share: 0.60 }
    - { max_years: null, max_share: 1.00 }

savings_rate:
  # Taux d'épargne = versements mensuels / revenu mensuel (RFR N-2 / 12).
  # Levier n° 1 de l'étude (§1.1) : à 20 ans, 58 % du capital final vient des versements.
  target: 0.15          # cible : 15 % du revenu (Épargnant 3.0, Bogleheads : 10 à 20 %)
  amber_min: 0.05       # en dessous de 5 % : rouge ; entre 5 et 15 % : orange
  escalation: 0.05      # « Save More Tomorrow » : +5 % du versement chaque année (Thaler-Benartzi)
  growth_for_20y: 0.05  # rendement nominal utilisé pour dire ce que l'écart vaut à 20 ans
  horizon_years: 20

goal:
  # « Combien épargner pour ton objectif » : problème inverse de la projection (étude §7.1, §8.1 point 7).
  target_probability: 0.75   # on vise 3 chances sur 4 (Brunel : besoins 90 %, envies 80 %, souhaits 65-75 %)
  amber_probability: 0.50    # en dessous d'une chance sur deux : rouge
  n_paths: 2000
  seed: 7

retirement:
  # Taux de retrait initial soutenable pour convertir « un revenu à vie » en capital.
  # 4 % (Bengen 1994, États-Unis) échoue dans plus de la moitié des cohortes françaises
  # (Pfau 2010) ; pour un portefeuille monde vu d'Europe : 3,5 % (ERN « le nouveau 4 % »,
  # Pfau monde 3,58 %), sans garde-fous dynamiques pour l'instant. Étude §1.4.
  withdrawal_rate: 0.035

projection:
  # Probabilité visée par le versement requis affiché sur la page Projection ;
  # même cible que le verdict « objectif » (3 chances sur 4).
  target_probability: 0.75
  # Fiscalité à la sortie, sur les plus-values seulement (fractions).
  # PEA après 5 ans : prélèvements sociaux 17,2 %. CTO : PFU 30 %.
  # Assurance vie après 8 ans : 7,5 % + 17,2 %, abattement annuel non compté.
  # PER : sortie en capital, plus-values au PFU (le capital déduit est imposé
  # au barème, hors de portée d'une projection sur la seule poche titres).
  tax_on_gains:
    pea: 0.172
    pee: 0.172
    cto: 0.30
    life_insurance: 0.247
    capitalisation: 0.247
    per: 0.30
  default_tax_on_gains: 0.30

performance:
  # En dessous, la série d'instantanés est trop courte pour un chiffre honnête.
  min_days: 30
  # Écart TRI − TWR annualisé : en dessous, le calendrier des versements coûte.
  gap_amber: -0.01

drawdown:
  # Alerte à chaque tranche de baisse (MiFID II art. 62 : −10 %, le jour même,
  # puis à chaque multiple de 10 %). Mesurée sur l'indice TWR, hors versements.
  alert_step: 0.10
  red_at: 0.20
