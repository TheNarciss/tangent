# Seuils des verdicts (ADR-023). Fractions annuelles.
# Dernière revue : 2026-09 — sources : étude méthode §1.3 et §8.2 (frais < 0,5 %/an
# pour un PEA + ETF indiciel ; AV bancaire en UC : 2 à 3 %/an).

fees:
  green_max: 0.005     # jusqu'à 0,5 %/an : rien à changer
  amber_max: 0.010     # jusqu'à 1 %/an : à surveiller ; au-delà, rouge
  reference: 0.003     # coût d'un PEA en ligne + ETF monde (TER ~0,20 % + courtage ~0,10 %)
  min_coverage: 0.5    # part de la valeur dont le TER est connu, en dessous : verdict « unknown »

next_euro:
  precaution_months: 3         # épargne de précaution visée : 3 mois de dépenses (étude §8.1 : 3 à 6 mois)
  precaution_min_months: 1     # en dessous d'un mois : rouge
  liquid_envelopes: [livret_a, livret_a_jeune, ldds, lep, livret_b, csl]
  pea_ceiling_eur: 150000      # plafond légal des versements sur un PEA
  pea_vs_cto_pct: 0.006        # écart de rendement net PEA vs CTO, borne basse (étude §1 : 60 à 90 pb/an)
  per_tmi_min: 0.30            # le PER déductible n'est intéressant qu'à partir de cette tranche (étude §8.1)
  per_ceiling_pct: 0.10        # plafond de déduction : 10 % des revenus…
  per_ceiling_min_eur: 4637    # …au moins 10 % du PASS N-1
  per_ceiling_max_eur: 37094   # …au plus 8 × 10 % du PASS N-1
  # Barème de l'impôt sur le revenu 2025 (revenus 2024), par part, service-public.fr.
  # À mettre à jour chaque année à la loi de finances.
  tax_brackets:
    - { up_to: 11497, rate: 0.00 }
    - { up_to: 29315, rate: 0.11 }
    - { up_to: 83823, rate: 0.30 }
    - { up_to: 180294, rate: 0.41 }
    - { up_to: null, rate: 0.45 }
