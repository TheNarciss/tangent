# Capital Market Assumptions — rendements annualisés long terme attendus,
# **par classe d'actifs** et non plus par ticker.
#
# La table était une liste de six tickers : ceux du premier utilisateur. Le
# fonds monde de n'importe qui d'autre n'avait aucune hypothèse et retombait
# sur son µ historique 5 ans, gonflé par le bull-run post-COVID. La classe
# vient maintenant de ce qu'est l'instrument (ADR-025).
#
# Source : Dimson-Marsh-Staunton Yearbook (100+ ans), Vanguard CMAs, JP Morgan
# LTCMA. À revoir annuellement. Dernière revue : 2026-09.
#
# Une classe absente d'ici garde son µ historique — aucune valeur par défaut —
# et l'app le signale à l'utilisateur. C'est volontaire : donner un rendement
# d'actions à un fonds obligataire, avec sa petite volatilité, en faisait le
# meilleur actif du monde aux yeux de l'optimiseur.
classes:
  equity_world: 0.07      # actions monde diversifiées
  equity_us: 0.07         # même hypothèse que le monde : les États-Unis en font les deux tiers
  equity_us_tech: 0.10    # Nasdaq-100 — prime de croissance, et volatilité qui va avec
  equity_europe: 0.06     # actions européennes larges
