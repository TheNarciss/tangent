# Configuration de l'intégration Powens — règles de mapping + sync
api_version: "2.0"
request_timeout_seconds: 30

# Mapping stock_market (label Powens) → suffixe yfinance ticker
# Ex: "Euronext Paris" + symbol "DCAM" → "DCAM.PA"
market_suffixes:
  "Euronext Paris": ".PA"
  "Euronext Amsterdam": ".AS"
  "Euronext Brussels": ".BR"
  "Euronext Lisbon": ".LS"
  "Xetra": ".DE"
  "Frankfurt": ".F"
  "London Stock Exchange": ".L"
  "Borsa Italiana": ".MI"
  "Bolsa de Madrid": ".MC"
  "SIX Swiss Exchange": ".SW"

# Règles d'identification des comptes — heuristiques sur le type + nom
# Powens renvoie type="pea" pour TOUS les sous-comptes PEA (espèces ET titres).
# On les distingue par le nom.
pea_titres:
  type: "pea"
  name_contains_any: ["Titres", "PEA Titres"]

pea_cash:
  type: "pea"
  name_contains_any: ["Espèces", "Especes", "Cash"]

# Types de comptes à mapper vers tes envelopes
account_type_mapping:
  pea: "pea"
  savings: "livret"
  lifeinsurance: "fonds_euro_av"
  checking: "checking"
  loan: "loan"
  market: "cto"

# Mapping Powens type → AccountType enum (neutral taxonomy, cf app/aggregator/types.py)
# Used by PowensAggregator to translate Powens-native types to provider-agnostic DTOs.
account_type_to_neutral:
  checking: "checking"
  savings: "savings"
  pea: "pea"
  cto: "cto"
  market: "cto"           # Powens uses "market" for classic CTO
  lifeinsurance: "life_insurance"
  loan: "loan"
  card: "card"
  crypto: "crypto"
  deposit: "savings"      # term deposit → savings
