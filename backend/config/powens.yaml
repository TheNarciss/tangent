# Configuration de l'intégration Powens — règles de mapping + sync
api_version: "2.0"
request_timeout_seconds: 30

# Mapping stock_market (label Powens) → suffixe yfinance ticker
# Ex: "Euronext Paris" + symbol "DCAM" → "DCAM.PA"
market_suffixes:
  "Euronext Paris": ".PA"
  "Euronext Amsterdam": ".AS"
  "Euronext Brussels": ".BR"
  "Euronext Lisbon": ".LS"
  "Xetra": ".DE"
  "Frankfurt": ".F"
  "London Stock Exchange": ".L"
  "Borsa Italiana": ".MI"
  "Bolsa de Madrid": ".MC"
  "SIX Swiss Exchange": ".SW"


account_type_mapping:
  pea: "pea"
  savings: "livret"
  lifeinsurance: "fonds_euro_av"
  checking: "checking"
  loan: "loan"
  market: "cto"

# Mapping Powens type → AccountType enum (neutral taxonomy, cf app/aggregator/types.py)
# Used by PowensAggregator to translate Powens-native types to provider-agnostic DTOs.
# Mapping Powens type → AccountType enum (neutral taxonomy, cf app/aggregator/types.py)
account_type_to_neutral:
  # Cash-flow
  checking: "checking"
  savings: "savings"
  card: "card"
  deposit: "deposit"
  joint: "joint"
  # Livrets / regulated savings
  livret_a: "livret_a"
  livret_b: "livret_b"
  ldds: "ldds"
  lep: "lep"
  pel: "pel"
  cel: "cel"
  csl: "csl"
  cat: "cat"
  # Investment
  pea: "pea"
  cto: "cto"
  market: "cto"            # Powens uses "market" for classic CTO
  lifeinsurance: "life_insurance"
  capitalisation: "capitalisation"
  real_estate: "real_estate"
  crowdlending: "crowdlending"
  # Retirement
  per: "per"
  perp: "perp"
  perco: "perco"
  madelin: "madelin"
  article83: "article_83"
  # Employee savings
  pee: "pee"
  rsp: "rsp"
  # Loans
  loan: "loan"
  mortgage: "mortgage"
  consumercredit: "consumer_credit"
  revolvingcredit: "revolving_credit"
  # Misc
  crypto: "crypto"
  unknown: "other"
