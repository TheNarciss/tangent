# Catalogue des enveloppes réglementées françaises.
#
# ⚠ TAUX RÉVISABLES : Livret A et LEP réévalués en février et août chaque année.
# À vérifier sur service-public.fr avant tout calcul important. Modifie ce fichier
# si la réglementation change — pas besoin de redéployer.
#
# Format :
#   rate_pct      : rendement annuel, fraction décimale (0.025 = 2,5 %)
#   ceiling_eur   : plafond légal en euros (null = pas de plafond)
#   tax_status    : "net" = exonéré IR + PS, "gross" = soumis à fiscalité
#   liquidity_days: délai de récupération des fonds (1 = immédiat)
#   eligibility   : règles filtrant l'accès selon le profil utilisateur

envelopes:
  livret_a_jeune:
    name: "Livret A Jeune"
    rate_pct: 0.030
    ceiling_eur: 1600
    tax_status: "net"
    liquidity_days: 1
    eligibility:
      age_min: 12
      age_max: 25

  livret_a:
    name: "Livret A"
    rate_pct: 0.024
    ceiling_eur: 22950
    tax_status: "net"
    liquidity_days: 1
    eligibility:
      age_min: 0

  ldds:
    name: "LDDS"
    rate_pct: 0.024
    ceiling_eur: 12000
    tax_status: "net"
    liquidity_days: 1
    eligibility:
      age_min: 18

  lep:
    name: "Livret d'Épargne Populaire"
    rate_pct: 0.035
    ceiling_eur: 10000
    tax_status: "net"
    liquidity_days: 1
    eligibility:
      age_min: 18
      # Plafond RFR N-2 = base + per_half_share × (parts × 2 − 2)
      # Source: service-public.fr (valeurs susceptibles d'être revues)
      rfr_max_base: 22419
      rfr_max_per_half_share: 5982

  pel:
    name: "PEL (Plan Épargne Logement)"
    rate_pct: 0.0175
    ceiling_eur: 61200
    tax_status: "gross"
    liquidity_days: 1460   # 4 ans de blocage
    eligibility:
      age_min: 0

  fonds_euro_av:
    name: "Fonds € (Assurance-Vie)"
    rate_pct: 0.025
    ceiling_eur: null
    tax_status: "gross"
    liquidity_days: 30
    eligibility:
      age_min: 18