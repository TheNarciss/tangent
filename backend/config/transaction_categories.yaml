# Code d'opération ISO 20022 : domaine/famille[/sous-famille], tels que la
# banque les envoie. Un virement n'est catégorisé que par le LLM (interne,
# salaire, remboursement : ça se lit dans le libellé), donc absent d'ici.
bank_transaction_code:
  - {code: PMNT/CCRD/CWDL, category: autre}       # retrait d'espèces
  - {code: PMNT/MCRD/CWDL, category: autre}       # retrait d'espèces (carte de crédit)
  - {code: ACMT/MDOP/CHRG, category: frais_bancaires}
  - {code: ACMT/MCOP/CHRG, category: frais_bancaires}
  - {code: PMNT/IDDT/UPDD, category: frais_bancaires} # prélèvement de frais
