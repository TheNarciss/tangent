# Catégorisation déterministe d'une opération, à la relève, avant tout LLM.
#
# Deux sources normalisées, qui viennent de la banque elle-même :
#
# - le code marchand MCC (ISO 18245) que les réseaux carte attachent à chaque
#   paiement : 5411 est un supermarché partout dans le monde, quel que soit
#   le libellé. Les plages ci-dessous sont celles de la norme, rangées dans
#   nos catégories (celles du gap-filler, transaction_category.py) ;
# - le code d'opération ISO 20022 (domaine/famille/sous-famille) : un retrait,
#   un prélèvement, un virement se reconnaissent sans lire le libellé.
#
# Ce fichier ne porte que des règles. Ce qu'aucune règle ne couvre reste sans
# catégorie et passe au LLM de nuit, comme avant.

mcc:
  # Transport aérien, location, hôtels (plages « travel » de la norme)
  - {from: 3000, to: 3299, category: voyages}     # compagnies aériennes
  - {from: 3300, to: 3499, category: transport}   # loueurs de voitures
  - {from: 3500, to: 3999, category: voyages}     # hôtels
  - {mcc: 4111, category: transport}              # transports en commun
  - {mcc: 4112, category: transport}              # rail voyageurs
