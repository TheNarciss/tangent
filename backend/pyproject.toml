[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Portfolio analytics dashboard — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "yfinance>=0.2.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # ─ DB & Auth (Phase 1-2) ─
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29",
    "greenlet>=3.0",          # requis par SQLAlchemy async sous le capot
    "alembic>=1.13",           # migrations DB
    "fastapi-users[sqlalchemy,oauth]>=13.0",
    "httpx-oauth>=0.15",            # Google OAuth (ADR-014)
    "fastapi-users-db-sqlalchemy>=6.0",
    "pwdlib[argon2]>=0.2",
    "argon2-cffi>=23.0",       # password hashing moderne
    "resend>=2.0.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.8.0",
    "cryptography>=42.0",      # Fernet pour chiffrer les tokens Powens
    # ─ LLM (Phase 3 - ADR-015) ─
    "anthropic>=0.40",         # Claude SDK pour les portfolio reviews
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.powens", "app.db", "app.auth", "app.finance", "app.repositories", "app.routers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",  # line too long
    "B008",  # Depends() in FastAPI defaults
    "RUF001",  # ambiguous unicode in strings (we use σ, μ, ρ in finance code)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: requires a running Postgres DB (slower)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
