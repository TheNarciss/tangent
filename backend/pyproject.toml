[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Portfolio analytics dashboard — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "yfinance>=0.2.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # ─ DB & Auth (Phase 1-2) ─
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29",
    "greenlet>=3.0",          # requis par SQLAlchemy async sous le capot
    "alembic>=1.13",           # migrations DB
    "fastapi-users[sqlalchemy]>=13.0",
    "fastapi-users-db-sqlalchemy>=6.0",
    "pwdlib[argon2]>=0.2",
    "argon2-cffi>=23.0",       # password hashing moderne
    "resend>=2.0.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.8.0",
    "cryptography>=42.0",      # Fernet pour chiffrer les tokens Powens
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.powens", "app.db", "app.auth", "app.finance", "app.repositories", "app.routers"]