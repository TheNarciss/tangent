name: iOS

# The iPhone app (ADR-035). `build` compiles the Xcode project for the
# simulator, unsigned, whenever the shell or the native bridge changes: it is
# the only place the Swift is compiled. `testflight` archives, signs and
# uploads to TestFlight on demand, with the secrets listed below.

on:
  pull_request:
    paths:
      - "frontend/ios/**"
      - "frontend/src/native/**"
      - "frontend/capacitor.config.ts"
      - "frontend/package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive, sign and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for the simulator (unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Web bundle into the Xcode project
        working-directory: frontend
        env:
          VITE_API_URL: "https://riskybusinesses.uk/api"
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Resolve Swift packages
        working-directory: frontend/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Compile
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild build \
            -project App.xcodeproj -scheme App -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -n 60

  testflight:
    name: Archive, sign, upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    # Secrets (repository settings → Secrets and variables → Actions):
    #   IOS_CERTIFICATE_P12_B64     Apple Distribution certificate, .p12 in base64
    #   IOS_CERTIFICATE_PASSWORD    its password
    #   IOS_PROVISIONING_PROFILE_B64  App Store provisioning profile, .mobileprovision in base64
    #   APPLE_TEAM_ID               ten characters
    #   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_B64
    #                               an App Store Connect API key (App Manager), .p8 in base64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Web bundle into the Xcode project
        working-directory: frontend
        env:
          VITE_API_URL: "https://riskybusinesses.uk/api"
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install the signing certificate and the profile
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: frontend/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 60

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>uk.riskybusinesses.tangent</key><string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.private_keys
          echo "$KEY_P8_B64" | base64 --decode > ~/.private_keys/AuthKey_"$KEY_ID".p8
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
