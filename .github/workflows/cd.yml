name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # permet de re-déployer manuellement depuis l'UI GitHub

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # ne pas annuler un déploiement en cours

jobs:
  deploy:
    name: Deploy main to riskybusinesses.uk
    runs-on: [self-hosted, Linux, oracle, prod]
    timeout-minutes: 30

    steps:
      - name: Cleanup Docker disk space (avoid 99% full disk killing builds)
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /var/lib/docker/ || true
          # Prune images/cache older than 7 days, keep volumes
          docker system prune -a --filter "until=168h" --force || true
          echo "Disk after cleanup:"
          df -h /var/lib/docker/ || true
          docker system df

      - name: Show current state
        run: |
          echo "Runner: $(hostname)"
          echo "Project: /home/ubuntu/projet_finance"
          cd "/home/ubuntu/projet_finance"
          echo "Current commit: $(git rev-parse --short HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"

      - name: Pull latest main
        working-directory: /home/ubuntu/projet_finance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV_COMMIT=$(git rev-parse HEAD)
          echo "PREV_COMMIT=$PREV_COMMIT" >> $GITHUB_ENV
          # Fetch via HTTPS with token embedded (avoids deploy key dependency
          # and works uniformly across self-hosted runners).
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/TheNarciss/tangent.git" \
              main:refs/remotes/origin/main
          git checkout main
          git reset --hard origin/main
          echo "New commit: $(git rev-parse --short HEAD)"

      - name: Rebuild + restart containers
        working-directory: /home/ubuntu/projet_finance
        run: |
          set -euo pipefail
          # The caddy image now bundles the frontend Vite build (see Dockerfile.caddy),
          # so rebuilding caddy = redeploying both Caddy config AND frontend bundle.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          sleep 5
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
      - name: Health check (60s timeout)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fs https://riskybusinesses.uk/health > /dev/null; then
              echo "✅ Healthy after $i attempts ($((i * 2))s)"
              curl -s https://riskybusinesses.uk/health
              exit 0
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "❌ Health check failed after 60s"
          cd "/home/ubuntu/projet_finance"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 backend
          exit 1

      - name: Rollback on failure
        if: failure()
        working-directory: /home/ubuntu/projet_finance
        run: |
          set -euo pipefail
          echo "::warning::Deployment failed, rolling back to $PREV_COMMIT"
          git reset --hard $PREV_COMMIT
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          sleep 5
          curl -fs https://riskybusinesses.uk/health && echo "✅ Rollback succeeded" || echo "❌ Rollback also failed — manual intervention needed"
